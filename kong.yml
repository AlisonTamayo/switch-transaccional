_format_version: "3.0"

services:
  # ==========================================
  # 1. SERVICIOS LEGACY (Frontend)
  # Corrección: URLs base apuntan al PATH del controlador
  # ==========================================
  - name: switch-nucleo-service-legacy
    url: http://ms-nucleo:8082/api/v1/transacciones
    routes:
      - name: ruta-transacciones-legacy
        paths:
          - /transacciones
        strip_path: true
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "OPTIONS"]

  - name: switch-directorio-service-legacy
    url: http://ms-directorio:8081/api/v1
    routes:
      - name: ruta-directorio-legacy
        paths:
          - /directorio
        strip_path: true
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "PATCH", "OPTIONS"]

  - name: switch-contabilidad-service-legacy
    url: http://ms-contabilidad:8083/api/v1/ledger
    routes:
      - name: ruta-contabilidad-legacy
        paths:
          - /contabilidad
        strip_path: true
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "OPTIONS"]

  - name: switch-compensacion-service-legacy
    url: http://ms-compensacion:8084/api/v1/compensacion
    routes:
      - name: ruta-compensacion-legacy
        paths:
          - /compensacion
        strip_path: true
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "OPTIONS"]

  # ==========================================
  # 2. SERVICIOS V1 (Bancos Actuales - ArcBank)
  # ==========================================
  - name: switch-nucleo-service-v1
    url: http://ms-nucleo:8082
    routes:
      - name: ruta-transacciones-v1
        paths:
          - /api/v1/transacciones
        strip_path: false
    plugins:
      - name: key-auth
        config:
          key_names: ["apikey"]
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "OPTIONS"]

  - name: switch-directorio-service-v1
    url: http://ms-directorio:8081
    routes:
      - name: ruta-directorio-v1
        paths:
          - /api/v1/directorio
          - /api/v1/instituciones
        strip_path: false
    plugins:
      - name: key-auth
        config:
          key_names: ["apikey"]
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "PATCH", "OPTIONS"]
  
  # ==========================================
  # 3. CONTRATO V2 (Compliance)
  # Mapeos especiales
  # ==========================================
  
  # RF-01 y RF-04: Transacciones
  - name: switch-contract-v2-transfers
    url: http://ms-nucleo:8082/api/v1/transacciones
    routes:
      - name: v2-transfers-start
        paths:
          - /api/v2/switch/transfers$
        strip_path: true
        methods: ["POST"]
      - name: v2-transfers-status
        paths:
          - /api/v2/switch/transfers/
        strip_path: true
        methods: ["GET"]
    plugins:
      - name: key-auth
        config:
          key_names: ["apikey"]
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "OPTIONS"]

  # RF-07: Devoluciones
  - name: switch-contract-v2-returns
    url: http://ms-contabilidad:8083/api/v1/ledger/v2/switch/transfers/return
    routes:
      - name: v2-transfers-return
        paths:
          - /api/v2/switch/transfers/return
        strip_path: true
        methods: ["POST"]
    plugins:
      - name: key-auth
        config:
          key_names: ["apikey"]
      - name: cors
        config:
          origins: ["*"]
          methods: ["POST", "OPTIONS"]

  # RF-01.1: Funding
  - name: switch-contract-v2-funding
    url: http://ms-contabilidad:8083/api/v1/ledger/cuentas
    routes:
      - name: v2-funding
        paths:
          - /funding
        strip_path: true
        methods: ["GET"]
    plugins:
      - name: key-auth
        config:
          key_names: ["apikey"]
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "OPTIONS"]

consumers:
  - username: NEXUS_BANK
    keyauth_credentials:
      - key: NEXUS_SECRET_KEY_123
  - username: ECUSOL_BK
    keyauth_credentials:
      - key: PUBLIC_KEY_ECUSOL_67890
  - username: ARCBANK
    keyauth_credentials:
      - key: ARCBANK_SECRET_KEY_2025_XYZ
  - username: BANTEC
    keyauth_credentials:
      - key: BANTEC_SECRET_KEY_2025
  - username: SWITCH_ADMIN
    keyauth_credentials:
      - key: SWITCH_ADMIN_SUPER_SECRET_KEY
