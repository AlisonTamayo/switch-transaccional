_format_version: "3.0"

services:
  - name: switch-nucleo-service
    url: http://ms-nucleo:8082
    routes:
      - name: ruta-transacciones
        paths:
          - /api/v1/transacciones
        strip_path: false
        methods:
          - POST
          - GET
    plugins:
      - name: key-auth
        config:
          key_names:
            - apikey
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - OPTIONS

  - name: switch-directorio-service
    url: http://ms-directorio:8081
    routes:
      - name: ruta-directorio
        paths:
          - /api/v1/directorio
          - /api/v1/instituciones
        strip_path: false
    plugins:
      - name: key-auth
        config:
          key_names:
            - apikey
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PATCH
            - OPTIONS

  - name: switch-contabilidad-service
    url: http://ms-contabilidad:8083
    routes:
      - name: ruta-contabilidad
        paths:
          - /api/v1/contabilidad
        strip_path: false
    plugins:
      - name: key-auth
        config:
          key_names:
            - apikey
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - OPTIONS

  - name: switch-compensacion-service
    url: http://ms-compensacion:8084
    routes:
      - name: ruta-compensacion
        paths:
          - /api/v1/compensacion
        strip_path: false
    plugins:
      - name: key-auth
        config:
          key_names:
            - apikey
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - OPTIONS

consumers:
  - username: NEXUS_BANK
    keyauth_credentials:
      - key: NEXUS_SECRET_KEY_123

  - username: ECUSOL_BK
    keyauth_credentials:
      - key: PUBLIC_KEY_ECUSOL_67890

  - username: ARCBANK
    keyauth_credentials:
      - key: ARCBANK_SECRET_KEY_2025_XYZ

  - username: BANTEC
    keyauth_credentials:
      - key: BANTEC_SECRET_KEY_2025

  - username: SWITCH_ADMIN
    keyauth_credentials:
      - key: SWITCH_ADMIN_SUPER_SECRET_KEY
